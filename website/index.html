ont-style:normal;background:linear-gradient(100deg,#b68aff,#fb86c5,#91c9ff);background-clip:text;color:transparent}p{line-height:1.75}.lead{font-size:17px;color:#c0bbd7;max-width:550px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:29px 0}.hero-note{color:#aaa5c2;font-size:13px}.hero-art{height:470px;position:relative;display:flex;justify-content:center;align-items:center;isolation:isolate}.halo{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,#b26cfc70 0%,#bd69f925 40%,transparent 70%);filter:blur(8px)}.orbit{width:365px;height:365px;border:1px solid #bc89ff5e;border-radius:50%;position:absolute;box-shadow:0 0 100px #a355ee20 inset;transform:rotate(-23deg)}.orbit:after{content:"";display:block;position:absolute;inset:35px;border-radius:50%;border:1px dashed #ff9bdb4a}.hero-card{width:265px;height:369px;background:linear-gradient(145deg,#453171,#1a1a39 50%,#46204a);border:6px solid #bba4f7;border-radius:22px;transform:rotate(-9deg);box-shadow:20px 25px 60px #06051099,0 0 40px #b074fd45;position:relative;overflow:hidden;z-index:2;padding:16px}.hero-card:before{content:"";position:absolute;inset:11px;border:1px solid #ffffff4d;border-radius:12px}.hero-card .figure{display:grid;place-items:center;height:240px;border-radius:14px;background:radial-gradient(circle at 45% 35%,#ffb8e17a,transparent 54%),linear-gradient(140deg,#513796,#231b51);font-size:135px;filter:drop-shadow(0 12px 10px #1c093a)}.hero-card .card-footer{padding:15px 7px}.hero-card .card-footer strong{font-size:22px;display:block}.hero-card .card-footer span{color:#c8b1ef;font-size:12px}.float{position:absolute;background:#1a1936ea;border:1px solid #ffffff25;border-radius:15px;padding:14px 17px;box-shadow:0 14px 48px #0007;z-index:3;font-size:13px}.float.one{left:0;top:85px}.float.two{right:-9px;bottom:68px}.float strong{display:block;font-size:17px}.muted{color:var(--muted)}.stats{border:1px solid #ffffff19;background:#121127c9;display:grid;grid-template-columns:repeat(3,1fr);border-radius:19px;padding:24px;margin-top:-5px;gap:10px;text-align:center}.stats strong{display:block;font:700 33px "Space Grotesk";background:linear-gradient(90deg,#d6b7ff,#f0ace1);background-clip:text;color:transparent}.stats span{color:var(--muted);font-size:13px}.section{padding:85px 0 35px}.eyebrow{color:var(--pink);text-transform:uppercase;font-size:12px;font-weight:800;letter-spacing:2px}.section h2,.pagehead h2{font-size:clamp(30px,4vw,45px);letter-spacing:-1.8px;margin:9px 0}.sub{color:var(--muted);max-width:620px;margin-bottom:34px}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.box{border:1px solid #ffffff1a;background:linear-gradient(135deg,#1b1936dc,#111126dc);border-radius:22px;padding:26px;transition:.2s}.box:hover{border-color:#ad7cff70;transform:translateY(-3px)}.ico{font-size:30px;background:#a077ff22;display:grid;place-items:center;width:58px;height:58px;border-radius:15px;margin-bottom:15px}.box h3{font-size:19px;margin:0 0 8px}.box p{font-size:14px;color:var(--muted);margin:0}.panel{background:linear-gradient(115deg,#302457,#1f1d48 55%,#33224f);border:1px solid #996ce34c;border-radius:25px;padding:36px;display:flex;justify-content:space-between;align-items:center;gap:30px}.panel h2{margin:0 0 12px;font-size:30px}.panel p{margin:0;color:#c7c2d9}.pagehead{padding:70px 0 20px}.searchrow{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.field{display:block;width:100%;padding:14px 15px;background:#0c0b1c;border:1px solid #3d3858;color:#fff;border-radius:13px;outline:none}.field:focus{border-color:#aa80ff;box-shadow:0 0 0 3px #a269ff21}.searchrow .field{flex:1;min-width:200px}.searchrow select{width:170px}.card-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.collect{border:1px solid #ffffff24;border-radius:17px;background:linear-gradient(155deg,#231c4a,#13152d);overflow:hidden}.collect .pic{height:205px;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 70% 25%,#e387d765,transparent 55%),linear-gradient(125deg,#373069,#171a39)}.collect .pic:before{content:"✦";font-size:105px;color:#ffffff19;position:absolute;transform:rotate(-18deg)}.collect .initial{font:700 75px "Space Grotesk";color:#fff;filter:drop-shadow(0 15px 15px #0006);position:relative}.tier{position:absolute;top:10px;right:10px;background:#0c0b1cde;border:1px solid #fff4;border-radius:7px;padding:5px 8px;color:#e8d2ff;font-weight:800;font-size:11px}.collect .info{padding:14px}.collect .info strong{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.collect .info span{font-size:12px;color:#a7a2bf;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}.auth{max-width:500px;margin:70px auto;padding:36px;border:1px solid #ffffff24;background:linear-gradient(135deg,#201c3b,#111126);border-radius:24px;box-shadow:0 30px 90px #0004}.auth h2{margin:5px 0;font-size:30px}.auth .blurb{color:var(--muted);font-size:14px;margin-bottom:25px}.formgrid{display:grid;gap:15px}.formgrid label{color:#e9e1fb;font-size:13px;font-weight:700}.formgrid label .field{margin-top:6px}.text-btn{border:0;background:transparent;color:#d9b3ff;text-decoration:underline;cursor:pointer}.auth .btn{width:100%;margin-top:8px}.notice{border:1px solid #aa79ff55;background:#9a73fb14;color:#d9cef0;border-radius:14px;padding:15px;font-size:13px;margin:15px 0}.dashboard{display:grid;grid-template-columns:280px 1fr;gap:22px;margin-bottom:90px}.side{height:fit-content}.avatar{display:grid;place-items:center;width:102px;height:102px;border-radius:29px;background:linear-gradient(135deg,#ad7af6,#f57fbd);font-size:40px;color:#1b1231;overflow:hidden;margin-bottom:16px;font-weight:800}.avatar img{width:100%;height:100%;object-fit:cover}.side h3{font-size:24px;margin:0}.status{display:inline-block;font-size:11px;font-weight:800;color:#f5d79e;background:#7a4c171f;border:1px solid #b8873655;padding:7px 9px;border-radius:20px;margin:14px 0}.status.ok{color:#a2f4d3;background:#1b6c472a;border-color:#6ff3c14f}.rows{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.rows .box{padding:18px}.rows b{font-size:25px;display:block;margin-top:5px}.dash-form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.dash-form .full{grid-column:1/-1}.avatar-preview{width:86px;height:86px;border-radius:18px;background:#31254e;display:grid;place-items:center;font-size:35px;overflow:hidden}.avatar-preview img{width:100%;height:100%;object-fit:cover}.footer{border-top:1px solid #ffffff14;padding:38px 0;margin-top:80px;color:#aaa6bf;font-size:13px}.footrow{display:flex;justify-content:space-between;gap:20px}.tag{font-size:11px;letter-spacing:.7px;color:#dfb3ff;border:1px solid #9b71df70;border-radius:20px;padding:6px 9px}.center{text-align:center}.empty{padding:70px 10px;text-align:center;color:var(--muted)}.pages{display:flex;gap:12px;align-items:center;justify-content:center;margin:25px 0}.hide{display:none!important}.hamb{display:none;background:none;color:#fff;border:0;font-size:22px}.mobile{display:none}#toast{position:fixed;bottom:24px;right:24px;border:1px solid #9677ec;background:#222042;padding:15px 20px;border-radius:13px;max-width:360px;box-shadow:0 20px 60px #0008;z-index:100;display:none}
@media(max-width:950px){.hero{grid-template-columns:1fr;min-height:auto;padding-top:60px}.hero-art{height:420px}.feature-grid{grid-template-columns:repeat(2,1fr)}.card-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.dashboard{grid-template-columns:1fr}.side{display:flex;align-items:center;gap:20px}.side .avatar{margin:0}.links{gap:13px}}

<body>
<header><nav class="nav"><a class="brand" href="/" data-route><span class="brand-icon">✦</span>Ani<strong>Chan</strong></a><div class="links"><a href="/" data-route>Home</a><a href="/cards" data-route>Cards</a><a href="/shop" data-route>Shop</a><a href="/guilds" data-route>Guilds</a><a href="/events" data-route>Events</a></div><a class="pill" href="/login" id="nav-account" data-route>Login / Register ↗</a><button class="hamb" id="menu-toggle" aria-label="Toggle menu">☰</button></nav><div id="mobile-nav" class="mobile hide"><a data-route href="/">Home</a><a data-route href="/cards">Cards</a><a data-route href="/shop">Shop</a><a data-route href="/guilds">Guilds</a><a data-route href="/events">Events</a><a data-route href="/login">Account</a></div></header>
<main id="app"><div class="empty">Loading AniChan…</div></main>
<footer class="footer"><div class="wrap footrow"><div><span class="brand">✦ Ani<strong>Chan</strong></span><p>Made for anime lovers. Built as an independent community experience.</p></div><div><p>WhatsApp bot · Collectible cards · Community games</p><p>© 2026 AniChan · Cloudflare powered · Early access</p></div></div></footer><div id="toast" role="status"></div>
<script>
const app=document.querySelector('#app');let current=null;let page=1;let searchTimer;let avatarValue='';const T=['C','B','A','S','SS','SSS'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window._to);window._to=setTimeout(()=>t.style.display='none',4300)}
async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});let data;try{data=await r.json()}catch{throw Error('Unexpected response from server.')}if(!r.ok)throw Error(data.error||'Request failed');return data}
function send(path,body){return api(path,{method:'POST',body:JSON.stringify(body)})}
function go(path){history.pushState({},'',path);route();scrollTo(0,0)}
document.addEventListener('click',e=>{const a=e.target.closest('a[data-route]');if(a){e.preventDefault();go(a.getAttribute('href'))}});window.onpopstate=route;document.querySelector('#menu-toggle').onclick=()=>document.querySelector('#mobile-nav').classList.toggle('hide');
function updateNav(){const n=document.getElementById('nav-account');n.textContent=current?'My Dashboard ↗':'Login / Register ↗';n.href=current?'/dashboard':'/login';document.querySelectorAll('.links a').forEach(x=>x.classList.toggle('active',x.getAttribute('href')===location.pathname))}
function hero(){return '<div class="wrap"><div class="hero"><div><span class="badge"><span class="dot"></span>Your next anime adventure starts here</span><h1>Collect legends.<br><em>Build your story.</em></h1><p class="lead">Your world of anime cards, virtual economy, challenges, and community — connected to AniChan on WhatsApp. A new generation of fandom experiences.</p><div class="actions"><a data-route class="btn" href="/register">Join AniChan ✦</a><a data-route class="btn alt" href="/cards">Explore the collection →</a></div><p class="hero-note">✧ Free to explore · Anime-first · Built for the community</p></div><div class="hero-art"><div class="halo"></div><div class="orbit"></div><div class="float one"><span class="muted">✦ Rarity unlocked</span><strong>SSS · Legendary</strong></div><div class="hero-card"><div class="figure">🌸</div><div class="card-footer"><strong>AniChan</strong><span>YOUR ANIME UNIVERSE · ✦✦✦</span></div></div><div class="float two"><span class="muted">🎴 Catalogue</span><strong>349 discovered</strong></div></div></div><div class="stats"><div><strong>349</strong><span>Cards in catalogue snapshot</span></div><div><strong>6</strong><span>Card rarity tiers</span></div><div><strong>∞</strong><span>Stories to create</span></div></div></div>'}
function home(){app.innerHTML=hero()+'<div class="wrap section"><span class="eyebrow">Experience the universe</span><h2>More than just a bot.</h2><p class="sub">Discover the systems that make AniChan a world worth returning to.</p><div class="feature-grid">'+[['🎴','Anime card collection','Discover rare characters, build your collection, and trade with other fans.'],['💠','Virtual economy','Earn coins, rise through the ranks, and explore a community-driven marketplace.'],['⚔️','Guild adventures','Build a guild, take on challenges, and make your mark with your crew.'],['🎮','Interactive games','Play chess, Connect 4, quizzes, battles, and more right inside WhatsApp.'],['🤖','Personality-powered AI','Talk to your favorite anime-inspired AI companions with contextual conversations.'],['✨','Seasonal events','Special drops, milestones, community competitions, and more are on the roadmap.']].map(x=>'<div class="box"><div class="ico">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[2]+'</p></div>').join('')+'</div></div><div class="wrap section"><div class="panel"><div><span class="eyebrow">Your journey begins here</span><h2>One account. One universe.</h2><p>Create your web profile today. Verified WhatsApp linking will be enabled in a future bot update.</p></div><a class="btn" href="/register" data-route>Create account ✨</a></div></div>'}
function pageIntro(ey,heading,desc){return '<div class="wrap pagehead"><span class="eyebrow">'+ey+'</span><h2>'+heading+'</h2><p class="sub">'+desc+'</p></div>'}
function cards(){page=1;app.innerHTML=pageIntro('The archive','Discover the cards','Browse the current AniChan catalogue snapshot. Card artwork previews are being redesigned; names and tiers are real catalogue records.')+'<div class="wrap"><div class="searchrow"><input class="field" id="q" placeholder="Search characters or anime series…" aria-label="Search catalogue"><select class="field" id="tier"><option value="">All rarities</option>'+T.map(x=>'<option>'+x+'</option>').join('')+'</select></div><div id="results" class="card-grid"></div><div id="pagination" class="pages"></div></div>';document.getElementById('q').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=1;loadCards()},260)};document.getElementById('tier').onchange=()=>{page=1;loadCards()};loadCards()}
async function loadCards(){const el=document.getElementById('results');if(!el)return;el.innerHTML='<div class="empty">Searching cards…</div>';let q=document.getElementById('q').value,t=document.getElementById('tier').value;try{const d=await api('/api/cards?q='+encodeURIComponent(q)+'&tier='+encodeURIComponent(t)+'&page='+page);if(!document.contains(el))return;el.innerHTML=d.cards.length?d.cards.map(c=>'<article class="collect"><div class="pic"><span class="tier">'+esc(c.tier)+'</span><span class="initial">'+esc(c.name.charAt(0).toUpperCase())+'</span></div><div class="info"><strong>'+esc(c.name)+'</strong><span>'+esc(c.series)+'</span></div></article>').join(''):'<div class="empty">No cards found. Try another search.</div>';const pages=Math.max(1,Math.ceil(d.total/20));document.getElementById('pagination').innerHTML='<button class="btn alt small" id="prev" '+(page<=1?'disabled':'')+'>← Previous</button><span class="muted">Page '+page+' of '+pages+' · '+d.total+' cards</span><button class="btn alt small" id="next" '+(page>=pages?'disabled':'')+'>Next →</button>';document.getElementById('prev').onclick=()=>{page--;loadCards()};document.getElementById('next').onclick=()=>{page++;loadCards()}}catch(e){el.textContent=e.message}}
function coming(type){const map={shop:['The marketplace','Buy, sell, and trade cards and items when account syncing launches.','🛒'],guilds:['Find your guild','Guild listings, quests, and leaderboards are being prepared for the website.','⚔️'],events:['Events & special drops','Follow the next season, community challenges, and exclusive card rewards.','✨']};const x=map[type];app.innerHTML=pageIntro('Coming soon',x[0],x[1])+'<div class="wrap"><div class="panel"><div><div style="font-size:60px;margin-bottom:15px">'+x[2]+'</div><h2>Something special is taking shape.</h2><p>Explore the card archive while this part of the AniChan ecosystem is being developed.</p></div><a data-route class="btn" href="/cards">Explore cards →</a></div></div>'}
function auth(mode){if(current){go('/dashboard');return}app.innerHTML='<div class="auth"><span class="eyebrow">AniChan account</span><h2>'+(mode==='register'?'Begin your journey ✨':'Welcome back 🌸')+'</h2><p class="blurb">'+(mode==='register'?'Create your website account. WhatsApp linking will become available once the bot integration launches.':'Sign in to manage your AniChan website profile.')+'</p><form class="formgrid" id="auth-form">'+(mode==='register'?'<label>Display name<input class="field" name="name" required minlength="2" maxlength="32" autocomplete="nickname" placeholder="What should we call you?"></label>':'')+'<label>Email address<input class="field" name="email" required type="email" autocomplete="email" placeholder="you@example.com"></label><label>Password<input class="field" name="password" required type="password" minlength="10" autocomplete="'+(mode==='register'?'new-password':'current-password')+'" placeholder="At least 10 characters"></label><button class="btn" type="submit">'+(mode==='register'?'Create account →':'Sign in →')+'</button></form><p class="center muted" style="font-size:13px;margin-top:20px">'+(mode==='register'?'Already have an account? <a href="/login" data-route class="text-btn">Sign in</a>':'New to AniChan? <a href="/register" data-route class="text-btn">Create an account</a>')+'</p><div class="notice">🔒 Accounts use secure session cookies. Website accounts are separate from your existing WhatsApp profile until verified linking is activated.</div></div>';document.getElementById('auth-form').onsubmit=async e=>{e.preventDefault();const f=e.target;const button=f.querySelector('button');button.disabled=true;try{const data=await send('/api/auth/'+mode,{email:f.email.value,password:f.password.value,displayName:f.name?.value});current=data.account;toast('Welcome to AniChan!');go('/dashboard')}catch(err){toast(err.message)}finally{button.disabled=false}}}
function avatarMarkup(a){return a.avatarData?'<img alt="Avatar" src="'+esc(a.avatarData)+'">':esc(a.displayName.charAt(0).toUpperCase())}
function dashboard(){if(!current){go('/login');return}avatarValue=current.avatarData||'';app.innerHTML=pageIntro('Account hub','Your AniChan space','Customize your website profile and prepare to link your WhatsApp identity.')+'<div class="wrap dashboard"><div class="box side"><div class="avatar" id="side-avatar">'+avatarMarkup(current)+'</div><div><h3>'+esc(current.displayName)+'</h3><p class="muted" style="margin:5px 0">'+esc(current.email)+'</p><span class="status '+(current.linked?'ok':'')+'">'+(current.linked?'✓ WhatsApp linked':'◷ Not linked yet')+'</span><br><button class="btn alt small" id="logout">Sign out</button></div></div><div><div class="rows"><div class="box"><span class="muted">Web profile</span><b>✓</b></div><div class="box"><span class="muted">WhatsApp sync</span><b>'+(current.linked?'✓':'—')+'</b></div><div class="box"><span class="muted">Catalogue</span><b>349</b></div></div><div class="box"><span class="eyebrow">Profile settings</span><h3>Edit your profile</h3><p class="muted" style="font-size:13px">Name, bio, and picture can now be managed on the website. WhatsApp synchronization requires a future verified-linking update.</p><form id="profile-form" class="dash-form"><label>Display name<input class="field" id="displayName" minlength="2" maxlength="32" required value="'+esc(current.displayName)+'"></label><label>Profile picture<input class="field" type="file" id="avatarUpload" accept="image/png,image/jpeg,image/webp"></label><label class="full">About you<textarea class="field" id="bio" maxlength="160" rows="3">'+esc(current.bio)+'</textarea></label><div class="full"><div class="avatar-preview" id="preview">'+avatarMarkup(current)+'</div><p class="muted" style="font-size:12px">Avatars are resized to 160×160 before upload.</p></div><button class="btn" type="submit">Save changes →</button></form></div><div class="box" style="margin-top:17px"><span class="eyebrow">WhatsApp connection</span><h3>Link your WhatsApp account</h3><p class="muted">Verified account linking is being prepared. No live bot data will be changed until the linking endpoint is securely connected and tested.</p><button class="btn alt small" disabled>Linking activates in next update</button></div></div></div>';document.getElementById('logout').onclick=async()=>{await send('/api/auth/logout',{});current=null;go('/')};document.getElementById('avatarUpload').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>4*1024*1024){toast('Please choose an image smaller than 4 MB');return}try{avatarValue=await resizeAvatar(file);document.getElementById('preview').innerHTML='<img alt="New avatar" src="'+esc(avatarValue)+'">'}catch(ex){toast('Could not process that image')}};document.getElementById('profile-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const d=await send('/api/profile',{displayName:document.getElementById('displayName').value,bio:document.getElementById('bio').value,avatarData:avatarValue});current=d.account;toast('Profile saved successfully ✨');dashboard()}catch(ex){toast(ex.message)}finally{b.disabled=false}}}
async function resizeAvatar(file){const bmp=await createImageBitmap(file);const c=document.createElement('canvas');c.width=160;c.height=160;const ctx=c.getContext('2d');const s=Math.min(bmp.width,bmp.height);ctx.drawImage(bmp,(bmp.width-s)/2,(bmp.height-s)/2,s,s,0,0,160,160);bmp.close();return c.toDataURL('image/webp',.78)}
function route(){updateNav();const p=location.pathname;if(p==='/')return home();if(p==='/cards')return cards();if(p==='/login'||p==='/register')return auth(p.slice(1));if(p==='/dashboard')return dashboard();if(['shop','guilds','events'].includes(p.slice(1)))return coming(p.slice(1));go('/')}
(async()=>{try{const r=await api('/api/me');current=r.account}catch{}route()})();
</script>
</body></html>
