name: AniChan API TypeScript validation
on:
  push:
    branches:
      - feature/typescript-express-mongodb
    paths:
      - 'website/api/**'
      - 'website/index.html'
      - '.github/workflows/anichan-api-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        working-directory: website/api
        run: npm install --ignore-scripts --no-audit
      - name: Generate Cloudflare types
        working-directory: website/api
        run: npx wrangler types
      - name: Compile-check API
        working-directory: website/api
        run: npm run check
      - name: Verify original AniChan HTML email design is preserved
        run: node website/api/verify-email-template.cjs

      - name: Check AniChan staging frontend JavaScript
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('website/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          if(!scripts.length)throw Error('No frontend JavaScript found');
          for(const entry of scripts) new vm.Script(entry[1]);
          console.log('Validated',scripts.length,'frontend script(s)');
          NODE
