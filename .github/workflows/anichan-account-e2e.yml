name: AniChan staging account end-to-end test
on:
  push:
    branches:
      - feature/typescript-express-mongodb
    paths:
      - 'website/api/verify-account-staging.mjs'
      - '.github/workflows/anichan-account-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test disposable website account against staged Express API
        run: node website/api/verify-account-staging.mjs
