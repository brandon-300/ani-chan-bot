name: AniChan temporary staging crypto compatibility check
on:
  push:
    branches:
      - feature/typescript-express-mongodb
    paths:
      - '.github/workflows/anichan-crypto-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check staging crypto support without any credentials
        run: |
          node -e "fetch('https://anichan-api-stage.pages.dev/api/_qa/crypto').then(async r=>{console.log(r.status,await r.text())}).catch(e=>{console.error(e.name);process.exit(1)})"
